# Verifies the server rejects invalid credentials with a visible error alert.
#
# Prerequisites:
#   - Network access to the backend
#   - PPO_NO set in the shell environment (any valid-format PPO number)
#
# Expected outcome:
#   The "Login Error!" alert becomes visible after the server responds.
appId: ${APP_ID}
name: Login - Invalid Credentials
tags:
  - login
  - network

---
# Start from a logged-out state.
- launchApp: ${APP_ID}
# - openLink: 'exp+cssp://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'

# Verify that the login screen is displayed.
- assertVisible:
    text: 'Pensioner Portal'

# Enter PPO number.
- tapOn:
    id: 'login-username'
- eraseText
- inputText: ${PPO_NO}
- hideKeyboard

# Enter a wrong password. It is 8+ chars with mixed case/digit/symbol so it
# passes client-side Zod validation and actually reaches the server.
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'WrongPass123!'
- hideKeyboard

# The form lives in a ScrollView — bring Submit into view before tapping.
- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN
- tapOn:
    id: 'login-submit'

# Verify that the backend rejects the credentials.
- extendedWaitUntil:
    visible:
      id: 'login-error-alert'
    timeout: 30000

# Verify the error message.
- assertVisible:
    text: 'Login Error!'
