# Verifies the Show/Hide password toggle on the login form.
# When masked (the default), secureTextEntry keeps the value out of the
# accessibility tree; revealing it exposes the plaintext; hiding re-masks it.
appId: ${APP_ID}
name: Login - Password Show/Hide Toggle
tags:
  - login
  - validation

---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: 'Pensioner Portal'

# Type a known password. The field starts masked.
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'VisiblePass1'
- hideKeyboard

# Tap the eye icon to unmask the password.
- tapOn:
    id: 'login-toggle-password'

- assertVisible: 'VisiblePass1'

# Tap again to re-mask it.
- tapOn:
    id: 'login-toggle-password'

# Masked fields expose an empty/redacted value to the a11y tree, so the
# exact plaintext must no longer be present.
- assertNotVisible: 'VisiblePass1'
