# Exercises the password length constraints from the shared Zod schema:
#   .string('Password is required')
#   .min(8, 'Password must be at least 8 characters')
#   .max(50, 'Password must be at most 50 characters')
#
# Every case follows the same shape: type the value, dismiss the keyboard,
# scroll Submit into view (the form is inside a ScrollView), tap Submit,
# then assert the error state.
appId: ${APP_ID}
name: Login - Password Validation
tags:
  - login
  - validation

---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: 'Pensioner Portal'

# Case 1 - too short: 7 characters (passes .string(), fails .min(8)).
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'Pass123'
- hideKeyboard

- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN
- tapOn:
    id: 'login-submit'

- assertVisible:
    id: 'login-error-password'
    text: 'Password must be at least 8 characters'

# Case 2 - too long: 51 characters (passes .min(8), fails .max(50)).
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
- hideKeyboard

- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN
- tapOn:
    id: 'login-submit'

- assertVisible:
    id: 'login-error-password'
    text: 'Password must be at most 50 characters'

# Case 3 - exactly 8 characters (valid): both length errors must be absent.
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'Pass1234'
- hideKeyboard

- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN
- tapOn:
    id: 'login-submit'

- assertNotVisible:
    id: 'login-error-password'
    text: 'Password must be at least 8 characters'

- assertNotVisible:
    id: 'login-error-password'
    text: 'Password must be at most 50 characters'
