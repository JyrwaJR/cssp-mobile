# Change-password self-healing restore flow: logs in using ${NEW_PASSWORD}
# (set by change-password-success.yaml), navigates to change-password via drawer,
# restores the account password back to original ${PASSWORD}, confirms via
# cp-confirm-yes, asserts success, and verifies subsequent login works with
# original ${PASSWORD}. Leaves test account in known-good state.
# Flow: launch -> login with ${NEW_PASSWORD} -> open drawer -> drawer-change-password
#   -> fill old (${NEW_PASSWORD}), new (${PASSWORD}), confirm (${PASSWORD}) ->
#   cp-submit -> cp-confirm-yes -> assert success -> logout -> log in with ${PASSWORD}.
# Markers/ids: drawer-change-password, cp-old-password, cp-new-password,
#   cp-confirm-password, cp-submit, cp-confirm-yes, drawer-logout.
# Env vars: APP_ID, PPO_NO, PASSWORD, NEW_PASSWORD.
appId: ${APP_ID}
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Pensioner Portal'
    timeout: 60000
# If already logged in with NEW_PASSWORD (showing home marker), log out first
- runFlow:
    when:
      visible: 'Submit your Digital Life Cerificate'
    commands:
      - swipe:
          start: 0%, 50%
          end: 80%, 50%
      - tapOn:
          id: 'drawer-logout'
      - assertVisible: 'Pensioner Portal'

# Log in with NEW_PASSWORD
- tapOn:
    id: 'login-input-username'
- eraseText
- inputText: ${PPO_NO}
- tapOn:
    id: 'login-input-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible: 'Submit your Digital Life Cerificate'
    timeout: 60000

# Navigate to change-password and restore original PASSWORD
- swipe:
    start: 0%, 50%
    end: 80%, 50%
- tapOn:
    id: 'drawer-change-password'
- assertVisible: 'Change Password'

- tapOn:
    id: 'cp-old-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'cp-new-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-confirm-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-submit'
- assertVisible: 'Change Password?'
- tapOn:
    id: 'cp-confirm-yes'
- assertVisible: 'Password Changed Successfully'

# Verify login works again with original PASSWORD
- swipe:
    start: 0%, 50%
    end: 80%, 50%
- tapOn:
    id: 'drawer-logout'
- assertVisible: 'Pensioner Portal'
- tapOn:
    id: 'login-input-username'
- eraseText
- inputText: ${PPO_NO}
- tapOn:
    id: 'login-input-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible: 'Submit your Digital Life Cerificate'
    timeout: 60000
