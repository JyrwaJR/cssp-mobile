# Change-password success: performs a REAL change_password backend call (POST
# /api/change_password/, ENDPOINTS.USER.CHANGE_PASSWORD) changing the password
# from ${PASSWORD} to ${NEW_PASSWORD} (Test1234!).
# Flow: login -> open drawer -> drawer-change-password -> fill old/new/confirm ->
#   tap cp-submit -> confirm dialog (cp-confirm-yes) -> assert success banner
#   ('Password Changed Successfully' / 'Your password has been updated...') ->
#   logout via drawer -> log in again using ${NEW_PASSWORD} to verify success.
# Markers/ids: drawer-change-password, cp-old-password, cp-new-password,
#   cp-confirm-password, cp-submit, cp-confirm-yes, drawer-logout.
# Env vars: APP_ID, PPO_NO, PASSWORD, NEW_PASSWORD.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/login.yaml
- swipe:
    start: 0%, 50%
    end: 80%, 50%
- tapOn:
    id: 'drawer-change-password'
- assertVisible: 'Change Password'

- tapOn:
    id: 'cp-old-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-new-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'cp-confirm-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'cp-submit'
- assertVisible: 'Change Password?'
- tapOn:
    id: 'cp-confirm-yes'
- assertVisible: 'Password Changed Successfully'
- assertVisible: 'Your password has been updated. Please use your new password for future log ins.'

# Verify login works with NEW_PASSWORD
- swipe:
    start: 0%, 50%
    end: 80%, 50%
- tapOn:
    id: 'drawer-logout'
- assertVisible: 'Pensioner Portal'
- tapOn:
    id: 'login-input-username'
- eraseText
- inputText: ${PPO_NO}
- tapOn:
    id: 'login-input-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible: 'Submit your Digital Life Cerificate'
    timeout: 60000
