# Change-password client-side validation: reproduces validation errors from
# ChangePasswrodSchema and passwordValidation (src/features/change-password/validators/change-password.ts
# & src/shared/validation/common/index.ts):
#   - 'Password must be at least 8 characters' (min 8 chars)
#   - 'New password and old password cannot be the same.' (old === new)
#   - 'New password and confirm password do not match.' (new !== confirm)
# Flow: login -> open drawer -> drawer-change-password -> test invalid inputs ->
#   assert respective error messages are visible.
# Markers/ids: drawer-change-password, cp-old-password, cp-new-password,
#   cp-confirm-password, cp-submit.
# Env vars: APP_ID, PPO_NO, PASSWORD.
appId: ${APP_ID}
---
- runFlow:
    file: ../helpers/login.yaml
- swipe:
    start: 0%, 50%
    end: 80%, 50%
- tapOn:
    id: 'drawer-change-password'
- assertVisible: 'Change Password'

# 1) Password too short (< 8 chars)
- tapOn:
    id: 'cp-old-password'
- eraseText
- inputText: 'OldPass1'
- tapOn:
    id: 'cp-new-password'
- eraseText
- inputText: 'short'
- tapOn:
    id: 'cp-confirm-password'
- eraseText
- inputText: 'short'
- assertVisible: 'Password must be at least 8 characters'

# 2) New password same as old password
- tapOn:
    id: 'cp-old-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-new-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-confirm-password'
- eraseText
- inputText: ${PASSWORD}
- assertVisible: 'New password and old password cannot be the same.'

# 3) New password and confirm password do not match
- tapOn:
    id: 'cp-old-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn:
    id: 'cp-new-password'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'cp-confirm-password'
- eraseText
- inputText: 'DifferentPass1!'
- assertVisible: 'New password and confirm password do not match.'
