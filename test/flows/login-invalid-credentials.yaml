# Verify server rejects invalid credentials with a visible error alert.
#
# Prerequisites:
#   - Network access to the backend
#   - PPO_NO set in the shell environment (any valid-format PPO number)
#   - Device connected or emulator running
#
# Expected outcome:
#   Login Error! alert becomes visible after the server responds.
name: Login – Invalid Credentials
tags:
  - login
  - network
---
# Wipe SecureStore session to guarantee the logged-out login screen.
- launchApp:
    clearState: true
    stopApp: true

# Branding anchor unique to the login screen.
- assertVisible: 'Pensioner Portal'

# Tap the username field by placeholder and fill it.
- tapOn: 'Enter your PPO No.'
- eraseText
- inputText: ${PPO_NO}
- hideKeyboard

# Tap the password field by placeholder and enter a wrong password.
# The password is 8+ chars with upper/lower/digit/symbol so it passes
# client-side Zod validation and reaches the server.
- tapOn: 'Enter your password'
- eraseText
- inputText: WrongPass123!
- hideKeyboard

# Scroll Submit into view and tap it.
- scrollUntilVisible:
    element:
      text: 'Submit'
    direction: DOWN
- tapOn: 'Submit'

# Wait for the server to respond with an error.
- extendedWaitUntil:
    visible: 'Login Error!'
    timeout: 30000
