# Verifies the Show/Hide password toggle on the login form.
# When masked (default), secureTextEntry prevents the value from appearing in
# the accessibility tree. Tapping "Show password" unmasks it so the plaintext
# becomes visible; tapping "Hide password" re-masks it.
name: Login — password show/hide toggle
tags: [login, validation]
---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: 'Pensioner Portal'

# Type a known password into the field. The field starts masked by default.
- tapOn: [{ id: 'login-password' }, 'Enter your password']
- eraseText
- inputText: 'VisiblePass1'
- hideKeyboard

# Tap the eye icon to reveal the password. Its accessibilityLabel is
# "Show password" when the field is currently masked (the initial state).
# Maestro's text selector matches accessibilityLabel on React Native.
- tapOn: [{ id: 'login-toggle-password' }, 'Show password']

# The plaintext should now be visible in the a11y tree.
- assertVisible: 'VisiblePass1'

# Tap again to re-mask. The label has flipped to "Hide password".
- tapOn: [{ id: 'login-toggle-password' }, 'Hide password']

# The value should no longer be visible. On Android, secureTextEntry
# fields expose an empty or redacted value to the a11y tree when masked,
# so the exact plaintext must NOT be present.
- assertNotVisible: 'VisiblePass1'
