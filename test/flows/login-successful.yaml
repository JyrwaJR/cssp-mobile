# Verify a valid login navigates to the Home screen.
#
# Prerequisites:
#   - Network access to the backend
#   - PPO_NO and PASSWORD set in the shell environment
#   - Device connected or emulator running
#
# Expected outcome:
#   Home screen appears with the "Verification Status" badge.
name: Login – Successful
tags:
  - login
  - network
  - happy-path
---
# Fail fast if PPO_NO or PASSWORD is missing — prevents a 30-second
# ambiguous timeout when credentials are simply absent.
- runScript: scripts/require-creds.js

# Wipe SecureStore session to land on the logged-out login screen.
# On iOS, expo-secure-store persists via Keychain; verify on-device
# that a prior session doesn't skip the login screen.
- launchApp:
    clearState: true
    stopApp: true

# Branding anchor unique to the login screen.
- assertVisible: 'Pensioner Portal'

# Tap the username field by placeholder and fill it.
- tapOn: [{ id: 'login-username' }, 'Enter your PPO No.']
- eraseText
- inputText: ${PPO_NO}
- hideKeyboard

# Tap the password field by placeholder and enter the real password.
- tapOn: [{ id: 'login-password' }, 'Enter your password']
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard

# Scroll Submit into view and tap it.
- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN
- tapOn: [{ id: 'login-submit' }, 'Submit']

# Wait for the server to respond and the Home screen to render.
- extendedWaitUntil:
    visible: 'Verification Status'
    timeout: 30000
