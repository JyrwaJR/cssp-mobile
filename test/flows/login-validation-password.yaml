# Exercises password length constraints from the shared Zod schema:
#   .string('Password is required')
#   .min(8, 'Password must be at least 8 characters')
#   .max(50, 'Password must be at most 50 characters')
name: Login — password validation
tags: [login, validation]
---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: 'Pensioner Portal'

# ── Case 1 — too short (7 chars) ──────────────────────────────────────
# Passes the .string() check but fails .min(8).
- tapOn: [{ id: 'login-password' }, 'Enter your password']
- eraseText
- inputText: 'Pass123'
- hideKeyboard
- scrollUntilVisible:
    element: { id: 'login-submit' }
    direction: DOWN
- tapOn: [{ id: 'login-submit' }, 'Submit']
- assertVisible: [{ id: 'login-error-password' }, 'Password must be at least 8 characters']

# ── Case 2 — too long (51 chars) ──────────────────────────────────────
# Passes .string() and .min(8) but fails .max(50).
- tapOn: [{ id: 'login-password' }, 'Enter your password']
- eraseText
- inputText: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
- hideKeyboard
- scrollUntilVisible:
    element: { id: 'login-submit' }
    direction: DOWN
- tapOn: [{ id: 'login-submit' }, 'Submit']
- assertVisible: [{ id: 'login-error-password' }, 'Password must be at most 50 characters']

# ── Case 3 — exactly 8 chars (valid) ──────────────────────────────────
# Passes all password checks. Both length errors must be absent.
- tapOn: [{ id: 'login-password' }, 'Enter your password']
- eraseText
- inputText: 'Pass1234'
- hideKeyboard
- scrollUntilVisible:
    element: { id: 'login-submit' }
    direction: DOWN
- tapOn: [{ id: 'login-submit' }, 'Submit']
- assertNotVisible: [{ id: 'login-error-password' }, 'Password must be at least 8 characters']
- assertNotVisible: [{ id: 'login-error-password' }, 'Password must be at most 50 characters']
