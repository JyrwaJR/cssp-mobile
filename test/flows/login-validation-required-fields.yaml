# Verifies client-side required-field validation on the login form.
# Tapping Submit with both fields empty should surface two distinct error messages.
name: Login — required fields (empty submit)
tags: [login, validation]
---
- launchApp:
    clearState: true
    stopApp: true

# Wait for the login screen to render. Pensioner Portal is unique branding
# that only appears on the login screen, so it confirms we landed correctly.
- assertVisible: 'Pensioner Portal'

# Clear any __DEV__ env prefill so both fields are genuinely empty.
- tapOn: 'Enter your PPO No.'
- eraseText
- tapOn: 'Enter your password'
- eraseText
- hideKeyboard

# Scroll Submit into view (the form is inside a ScrollView).
- scrollUntilVisible:
    element: { text: 'Submit' }
    direction: DOWN

# Submit with both fields empty — Zod should reject both.
- tapOn: 'Submit'

# Both required-field errors should appear simultaneously.
- assertVisible: 'Username is Required'
- assertVisible: 'Password is required'
