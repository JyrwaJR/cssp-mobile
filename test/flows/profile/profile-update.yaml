# Profile update: performs a REAL update_profile backend call (POST
# /api/update_profile/, ENDPOINTS.USER.UPDATE_PROFILE) with ENV-DRIVEN SAFE
# VALUES. Updates the display NAME (to ${PROFILE_DISPLAY_NAME}) and fills
# organization (to ${PROFILE_ORG_NAME} per RS7 validation requirements), leaving
# username UNTOUCHED so the login username (${PPO_NO}) is never modified.
# Flow: login -> Profile tab -> open /profile/update via profile-update ->
#   edit name and organization -> profile-save -> assert success marker (inline
#   success view, profile-update-screen.tsx) -> Android back -> assert updated
#   name renders on profile screen.
# Markers/ids:
#   profile-update (profile-screen.tsx:72), profile-input-name:91,
#   profile-input-org:118, profile-save:167 (profile-update-screen.tsx). Success
#   text 'Profile Updated':60 / 'Your profile has been updated.':64.
# Name refresh grounding: useUpdateProfile.onSuccess merges the new name into
# the auth store via setUser (use-update-profile.ts).
# Env vars: APP_ID, PPO_NO, PASSWORD, PROFILE_DISPLAY_NAME, PROFILE_ORG_NAME.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/login.yaml
- tapOn:
    id: 'tab-profile'
- assertVisible: 'Personal info'
- scrollUntilVisible:
    element:
      id: 'profile-update'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'profile-update'
- assertVisible: 'Update Profile'
- assertVisible: 'Update your profile details below.'
- assertVisible:
    id: 'profile-input-name'
- tapOn:
    id: 'profile-input-name'
- eraseText
- inputText: ${PROFILE_DISPLAY_NAME}
- tapOn:
    id: 'profile-input-org'
- eraseText
- inputText: ${PROFILE_ORG_NAME}
- tapOn:
    id: 'profile-save'
- assertVisible: 'Profile Updated'
- assertVisible: 'Your profile has been updated.'
- back
- assertVisible: ${PROFILE_DISPLAY_NAME}
